name: Copia de seguridad diaria

on:
  schedule:
    - cron: "3 8 * * *" # 08:03 UTC = 09:03 en invierno / 10:03 en verano (Andorra): nunca antes de las 9, cuando nadie toca la app
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Comprobar secretos
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secretos BACKUP_DATABASE_URL y/o BACKUP_PASSPHRASE (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Instalar pg_dump (PostgreSQL 18)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Exportar la base de datos
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump "$BACKUP_DATABASE_URL" \
            --format=custom --no-owner --no-privileges --file "familycash-$STAMP.dump"
          # Comprobar que la copia se puede leer y que tiene datos
          /usr/lib/postgresql/18/bin/pg_restore --list "familycash-$STAMP.dump" > contenido.txt
          grep -Eq 'TABLE DATA public "?Employee"? ' contenido.txt
          grep -Eq 'TABLE DATA public "?DayEntry"? ' contenido.txt
          echo "Copia correcta: $(du -h "familycash-$STAMP.dump" | cut -f1)"

      - name: Cifrar
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "familycash-$STAMP.dump.gpg" "familycash-$STAMP.dump"
          shred -u "familycash-$STAMP.dump"

      - name: Guardar la copia (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: familycash-db-${{ env.STAMP }}
          path: familycash-${{ env.STAMP }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
